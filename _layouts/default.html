<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta property="og:site_name" content="Matvey (Matthew) Moisseyev" />
    <meta property="og:title" content="Matvey (Matthew) Moisseyev" />
    <meta name="description" content="Matvey (Matthew) Moisseyev's Personal Website" />
    <meta name="keywords" content="Matvey (Matthew) Moisseyev, Matvey Moisseyev, Matthew Moisseyev, Moisseyev, UNL" />
    <meta name="author" content="Matvey (Matthew) Moisseyev" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }}</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
    <script>
      var theme = localStorage.getItem('theme');
      if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    </script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ '/assets/cmun-serif/cmun-serif.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    
    <script>
      // Smooth scroll
      $(document).ready(function() {
        // Theme Toggle
        var current = document.documentElement.getAttribute('data-theme');
        $("#toggle-theme i").attr('class', current === 'dark' ? 'far fa-sun' : 'far fa-moon');

        $("#toggle-theme").click(function() {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          $(this).find('i').attr('class', next === 'dark' ? 'far fa-sun' : 'far fa-moon');

        })

        // Lightbox
        $(".project-image, .cover-image").addClass("lightbox-trigger");

        $(".lightbox-trigger").click(function(e) {
          e.preventDefault();
          $("#lightbox img").attr({ src: this.href || this.src, alt: this.title || this.alt || "" });
          $("#lightbox").addClass("open");
          $("body").css("overflow", "hidden");
        })

        $("#lightbox").click(function() {
          $(this).removeClass("open");
          $("body").css("overflow", "");
        })

        $(document).keydown(function(e) {
          if (e.key === "Escape") $("#lightbox").click();
        })

        // Toggle publication excerpts
        $(".tldr_btn").click(function(e) {
          e.preventDefault();
          $(this).parent().parent().find(".publication-excerpt").slideToggle(300);
        });
        
        // Add fade-in animation to elements
        $(window).scroll(function() {
          $('.fade-in').each(function() {
            var elementTop = $(this).offset().top;
            var elementBottom = elementTop + $(this).outerHeight();
            var viewportTop = $(window).scrollTop();
            var viewportBottom = viewportTop + $(window).height();
            
            if (elementBottom > viewportTop && elementTop < viewportBottom) {
              $(this).addClass('visible');
            }
          });
        });
      });

      
    </script>
  </head>
  <body>
    <div id="lightbox" role="dialog" aria-modal="true">
      <img src="" alt="" />
    </div>

    <main role="main" class="container fade-in">
      {{ content }}
    </main>

    <footer class="footer">
      <div class="container">
        
        <div class="row">
          <div class="col text-center">
            <div class="social-links mb-3">
              <a href="mailto:mmoisseyev2@huskers.unl.edu" title="Email"><i class="fas fa-envelope"></i></a>
              <a href="https://www.linkedin.com/in/matthew-moisseyev" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
              <a href="https://github.com/mmoiss" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
              <button id="toggle-theme" title="Toggle Theme"><i class="far fa-moon"></i></button>
            </div>
           
            <span class="text-muted">
              Feel free to use the <a href="https://github.com/TonyLianLong/websitev2" target="_blank">source code</a> of this website. References designs from <a href="https://github.com/HaozhiQi/haozhiqi.github.io/" target="_blank">Haozhi Qi</a> and <a href="https://github.com/jonbarron/website" target="_blank">Jon Barron</a>. The fonts are based on <a href="https://checkmyworking.com/cm-web-fonts/" target="_blank">this</a> project. Uses <a href="https://github.com/jekyll/jekyll" target="_blank">Jekyll</a> and <a href="https://getbootstrap.com/" target="_blank">Bootstrap</a>.
            </span>
          </div>
        </div>
        
      </div>
    </footer>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  </body>
</html>
